name: Compile Typst CVs and Letter

on:
  push:
    paths:
      - '**.typ'
      - 'metadata.toml'
      - 'modules_en/**'
      - 'src/**'
  pull_request:
    paths:
      - '**.typ'
      - 'metadata.toml'
      - 'modules_en/**'
      - 'src/**'

jobs:
  compile-pdfs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Typst
        run: |
          # Download latest Typst release from GitHub
          TYPST_VERSION="v0.12.0"
          wget -q "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xf typst-x86_64-unknown-linux-musl.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          rm -rf typst-x86_64-unknown-linux-musl*
          typst --version

      - name: Install required fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-roboto fonts-font-awesome
          # Install Source Sans Pro
          mkdir -p ~/.local/share/fonts
          wget -q https://github.com/adobe-fonts/source-sans/releases/download/3.052R/TTF-source-sans-3.052R.zip
          unzip -q TTF-source-sans-3.052R.zip -d ~/.local/share/fonts/
          fc-cache -fv

      - name: Compile all CV variants
        run: |
          echo "=== Compiling all CV variants ==="

          # Compile standard CV
          echo "Compiling cv.typ..."
          typst compile cv.typ cv.pdf

          # Compile Senior PM variant
          echo "Compiling cv_senior_pm.typ..."
          typst compile cv_senior_pm.typ cv_senior_pm.pdf

          # Compile Superintendent variant
          echo "Compiling cv_superintendent.typ..."
          typst compile cv_superintendent.typ cv_superintendent.pdf

          # Compile Estimator variant
          echo "Compiling cv_estimator.typ..."
          typst compile cv_estimator.typ cv_estimator.pdf

          # Compile Executive Summary
          echo "Compiling cv_exec_summary.typ..."
          typst compile cv_exec_summary.typ cv_exec_summary.pdf

          # Compile Cover Letter (only if it exists)
          if [ -f "letter.typ" ]; then
            echo "Compiling letter.typ..."
            typst compile letter.typ letter.pdf
          fi

          echo "=== Compilation complete ==="
          ls -lh *.pdf

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            cv.pdf
            cv_senior_pm.pdf
            cv_superintendent.pdf
            cv_estimator.pdf
            cv_exec_summary.pdf
            letter.pdf
          if-no-files-found: warn

      - name: Commit and push PDFs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add generated PDFs
          git add *.pdf

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-compile PDFs from Typst sources [skip ci]"
            git push
          fi
