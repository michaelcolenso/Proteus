name: Compile CV and Letter

on:
  push:
    paths:
      - '**.typ'
      - 'metadata.toml'
      - 'modules_en/**'
      - 'src/**'
      - '.github/workflows/compile-pdfs.yml'
  pull_request:
    paths:
      - '**.typ'
      - 'metadata.toml'
      - 'modules_en/**'
      - 'src/**'
      - '.github/workflows/compile-pdfs.yml'
  workflow_dispatch:

jobs:
  compile-pdfs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: 'latest'

      - name: Verify Typst installation
        run: |
          echo "Checking Typst installation..."
          which typst || echo "ERROR: typst not found in PATH"
          typst --version || echo "ERROR: typst command failed"
          echo "PATH: $PATH"

      - name: Install required fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-roboto fonts-font-awesome
          # Install Source Sans Pro
          mkdir -p ~/.local/share/fonts
          wget -q https://github.com/adobe-fonts/source-sans/releases/download/3.052R/TTF-source-sans-3.052R.zip
          unzip -q TTF-source-sans-3.052R.zip -d ~/.local/share/fonts/
          fc-cache -fv

      - name: Compile CV and Letter
        run: |
          echo "=== Compiling CV and Cover Letter ==="

          # Verify Typst is available
          echo "Verifying Typst before compilation..."
          which typst
          typst --version
          echo ""

          # Compile CV
          echo "Compiling cv.typ..."
          typst compile cv.typ cv.pdf

          # Compile Cover Letter (only if it exists)
          if [ -f "letter.typ" ]; then
            echo "Compiling letter.typ..."
            typst compile letter.typ letter.pdf
          fi

          echo "=== Compilation complete ==="
          ls -lh *.pdf

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            cv.pdf
            letter.pdf
          if-no-files-found: warn

      - name: Commit and push PDFs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add generated PDFs
          git add *.pdf

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-compile PDFs from Typst sources [skip ci]"
            git push
          fi
