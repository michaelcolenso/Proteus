name: Compile Typst CVs and Letter

on:
  push:
    paths:
      - '**.typ'
      - 'metadata.toml'
      - 'modules_en/**'
      - 'src/**'
      - '.github/workflows/compile-pdfs.yml'
  pull_request:
    paths:
      - '**.typ'
      - 'metadata.toml'
      - 'modules_en/**'
      - 'src/**'
      - '.github/workflows/compile-pdfs.yml'
  workflow_dispatch:

concurrency:
  group: typst-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-pdfs:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: 'latest'

      - name: Verify Typst installation
        run: |
          set -euo pipefail
          echo "Checking Typst installation..."
          which typst
          typst --version
          echo "PATH: $PATH"

      - name: Install required fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-roboto fonts-font-awesome unzip
          mkdir -p ~/.local/share/fonts
          curl -fsSL -o /tmp/TTF-source-sans-3.052R.zip <https://github.com/adobe-fonts/source-sans/releases/download/3.052R/TTF-source-sans-3.052R.zip>
          unzip -q /tmp/TTF-source-sans-3.052R.zip -d ~/.local/share/fonts/
          rm -f /tmp/TTF-source-sans-3.052R.zip
          fc-cache -f

      - name: Compile CVs, cover letter, and portfolio
        run: |
          set -euo pipefail
          echo "=== Compiling all documents ==="
          which typst
          typst --version
          echo ""

          sources=(
            cv.typ
            cv_estimator.typ
            cv_exec_summary.typ
            cv_senior_pm.typ
            cv_superintendent.typ
            letter.typ
            portfolio.typ
          )

          for source in "${sources[@]}"; do
            output="${source%.typ}.pdf"
            echo "Compiling ${source}..."
            typst compile "${source}" "${output}"
          done

          echo "=== Compilation complete ==="
          ls -lh *.pdf

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            cv.pdf
            cv_estimator.pdf
            cv_exec_summary.pdf
            cv_senior_pm.pdf
            cv_superintendent.pdf
            letter.pdf
            portfolio.pdf
          if-no-files-found: error

      - name: Commit and push PDFs
        if: github.event_name == 'push' && github.ref == 'refs/heads/primary'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.pdf
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-compile PDFs from Typst sources [skip ci]"
            git push
          fi
