name: Compile Typst CVs and Letter

on:
  push:
    paths:
      - '**.typ'
      - 'metadata.toml'
      - 'modules_en/**'
      - 'src/**'
      - '.github/workflows/compile-pdfs.yml'
  pull_request:
    paths:
      - '**.typ'
      - 'metadata.toml'
      - 'modules_en/**'
      - 'src/**'
      - '.github/workflows/compile-pdfs.yml'
  workflow_dispatch:

jobs:
  compile-pdfs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: 'latest'

      - name: Verify Typst installation
        run: |
          echo "Checking Typst installation..."
          which typst || echo "ERROR: typst not found in PATH"
          typst --version || echo "ERROR: typst command failed"
          echo "PATH: $PATH"

      - name: Install required fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-roboto fonts-font-awesome
          # Install Source Sans Pro
          mkdir -p ~/.local/share/fonts
          wget -q https://github.com/adobe-fonts/source-sans/releases/download/3.052R/TTF-source-sans-3.052R.zip
          unzip -q TTF-source-sans-3.052R.zip -d ~/.local/share/fonts/
          fc-cache -fv

      - name: Compile CVs and cover letter
        run: |
          echo "=== Compiling CVs and cover letter ==="

          # Verify Typst is available
          echo "Verifying Typst before compilation..."
          which typst
          typst --version
          echo ""

          # Compile CVs
          echo "Compiling cv.typ..."
          typst compile cv.typ cv.pdf

          echo "Compiling cv_senior_pm.typ..."
          typst compile cv_senior_pm.typ cv_senior_pm.pdf

          echo "Compiling cv_superintendent.typ..."
          typst compile cv_superintendent.typ cv_superintendent.pdf

          echo "Compiling cv_estimator.typ..."
          typst compile cv_estimator.typ cv_estimator.pdf

          echo "Compiling cv_exec_summary.typ..."
          typst compile cv_exec_summary.typ cv_exec_summary.pdf

          # Compile Cover Letter
          echo "Compiling letter.typ..."
          typst compile letter.typ letter.pdf

          echo "=== Compilation complete ==="
          ls -lh *.pdf

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            cv.pdf
            cv_senior_pm.pdf
            cv_superintendent.pdf
            cv_estimator.pdf
            cv_exec_summary.pdf
            letter.pdf
          if-no-files-found: error

      - name: Commit and push PDFs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add generated PDFs
          git add *.pdf

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-compile PDFs from Typst sources [skip ci]"
            git push
          fi
