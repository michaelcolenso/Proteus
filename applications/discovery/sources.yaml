# Public job discovery settings.
#
# Live discovery only reads enabled public sources below. Keep source entries
# disabled until you replace the sample URLs with real public career pages.
queries:
  - construction project manager
  - senior project manager construction
  - multifamily project manager
  - construction superintendent
  - construction estimator
  - owner's representative construction

locations:
  - Seattle, WA
  - Bellevue, WA
  - Remote

include_terms:
  - project manager
  - senior project manager
  - construction manager
  - superintendent
  - estimator
  - preconstruction
  - owner representative
  - multifamily
  - luxury residential
  - general contractor

exclude_terms:
  - software engineer
  - product manager
  - account executive
  - internship
  - unpaid

sources:
  # Lever boards support a JSON endpoint at the board URL plus ?mode=json.
  - type: lever
    name: sample-lever
    url: https://jobs.lever.co/example
    enabled: false

  # Generic career pages are parsed from public job links on the page.
  # Add company and location fields when the page does not include them.
  - type: career_page
    name: sample-career-page
    url: https://example.com/careers
    enabled: false
